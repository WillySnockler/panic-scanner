<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#07090f"><title>Panic Scanner — Owner Recovery</title><style>body{margin:0;background:#07090f;color:#f6f8fc;font-family:Inter,system-ui,-apple-system,sans-serif;min-height:100vh;display:grid;place-items:center;padding:20px;box-sizing:border-box}.box{width:min(460px,100%);background:#0d131d;border:1px solid #293448;border-radius:22px;padding:28px;box-sizing:border-box;box-shadow:0 30px 100px #000}.badge{display:inline-block;color:#f5c85c;border:1px solid #f5c85c55;border-radius:99px;padding:7px 10px;font-size:10px;font-weight:900;letter-spacing:1px}.box h1{font-size:28px;margin:16px 0 7px}.box p{color:#8490a4;font-size:12px;line-height:1.55}.label{display:block;color:#8c98aa;font-size:9px;font-weight:900;letter-spacing:1px;text-transform:uppercase;margin:18px 0 7px}input{display:block;width:100%;box-sizing:border-box;padding:14px;border:1px solid #263246;border-radius:11px;background:#070c13;color:#fff;outline:none}button{width:100%;margin-top:18px;border:0;border-radius:11px;padding:14px;background:#8b7cff;color:#fff;font-weight:950;font-size:15px}.msg{min-height:20px;margin-top:14px;color:#aeb9cc;font-size:11px;line-height:1.5}.success{color:#35d59d}</style></head><body><main class="box"><span class="badge">OWNER RECOVERY</span><h1>Reset your owner password</h1><p>This is a one-time recovery page for the Panic Scanner owner account. After the password is changed, sign in normally and your existing Admin/Elite permissions will be loaded from your account.</p><label class="label">Recovery token</label><input id="token" type="text" autocomplete="off" placeholder="Paste your one-time token"><label class="label">New password</label><input id="password" type="password" autocomplete="new-password" placeholder="At least 12 characters"><label class="label">Confirm password</label><input id="confirm" type="password" autocomplete="new-password" placeholder="Repeat the password"><button id="go">Set owner password</button><div id="msg" class="msg"></div></main><script>const ENDPOINT='https://xinhpzibmvzqzahcklgy.supabase.co/functions/v1/owner-recover';document.getElementById('go').onclick=async()=>{const msg=document.getElementById('msg'),token=document.getElementById('token').value.trim(),password=document.getElementById('password').value,confirm=document.getElementById('confirm').value;if(!token||password.length<12||password!==confirm){msg.textContent=password!==confirm?'Passwords do not match.':'Enter the token and a password of at least 12 characters.';return}msg.textContent='Updating owner password…';try{const r=await fetch(ENDPOINT,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({token,password})});const d=await r.json();if(!r.ok)throw new Error(d.error||'Recovery failed');msg.className='msg success';msg.textContent='Owner password updated. You can now return to Panic Scanner and sign in normally.';document.getElementById('token').value='';document.getElementById('password').value='';document.getElementById('confirm').value='';document.getElementById('go').disabled=true}catch(e){msg.textContent=e.message||'Recovery failed.'}};</script></body></html>
